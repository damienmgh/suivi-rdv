<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<title>Suivi RDV MGH</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* Layout : barre d'en-tête fixe, onglets, vue liste + panneau fiche à droite (plein écran sur mobile) */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#2F3138; --text:#4A4C52; --muted:#6B6E74; --label:#8F9298;
  --line:#E4E5E7; --accent:#24346C; --accent-ink:#FFFFFF; --accent-soft:#E6E9F3; --night:#18234A;
  --ok:#2E7D32; --warn:#C77700; --crit:#B71C1C; --ok-soft:#E5F2E6; --warn-soft:#FBF0DF; --crit-soft:#F8E3E3;
  --plate:#FFFFFF; --shadow:0 8px 28px rgba(24,35,74,.14);
  --f-body:"Barlow",Arial,Helvetica,sans-serif; --f-cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1320; --surface:#161B2B; --surface-2:#1B2133; --ink:#E7E9F0; --text:#C9CCD6; --muted:#9AA0AE; --label:#8C92A2;
  --line:#2A3146; --accent:#8FA3E8; --accent-ink:#0F1320; --accent-soft:#232C48; --night:#0B1022;
  --ok:#6CC070; --warn:#E5A23A; --crit:#EF7B7B; --ok-soft:#1D2E22; --warn-soft:#33281A; --crit-soft:#3A2024;
  --plate:#FFFFFF; --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1320; --surface:#161B2B; --surface-2:#1B2133; --ink:#E7E9F0; --text:#C9CCD6; --muted:#9AA0AE; --label:#8C92A2;
  --line:#2A3146; --accent:#8FA3E8; --accent-ink:#0F1320; --accent-soft:#232C48; --night:#0B1022;
  --ok:#6CC070; --warn:#E5A23A; --crit:#EF7B7B; --ok-soft:#1D2E22; --warn-soft:#33281A; --crit-soft:#3A2024;
  --plate:#FFFFFF; --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lbl{font-family:var(--f-cond);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--label)}
.num{font-variant-numeric:tabular-nums}

/* En-tête */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-top:4px solid var(--accent);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.plate{background:var(--plate);padding:4px 6px;display:flex;border-radius:2px}
.plate img{height:36px;width:auto;display:block}
.brand h1{margin:0;font-size:18px;font-weight:700;color:var(--ink);line-height:1.1}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500}
nav.tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{background:none;border:0;padding:8px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.who{display:flex;align-items:center;gap:6px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:3px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.mode{font-family:var(--f-cond);font-weight:600;font-size:12px;letter-spacing:.08em;padding:3px 8px;background:var(--warn-soft);color:var(--warn);border-radius:2px}
.mode.live{background:var(--ok-soft);color:var(--ok)}

main{padding-block:20px 48px}
.demo-note{font-size:13px;color:var(--muted);margin:0 0 16px}

/* Tableau de bord */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;min-width:0}
.panel h2{margin:0 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.span-12{grid-column:span 12}.span-7{grid-column:span 7}.span-5{grid-column:span 5}.span-6{grid-column:span 6}
@media (max-width:900px){.span-7,.span-5,.span-6{grid-column:span 12}}
.pipe{display:flex;height:34px;border-radius:3px;overflow:hidden;background:var(--surface-2)}
.pipe button{border:0;padding:0;min-width:3px;color:#fff;font-weight:700;font-size:13px}
.pipe-legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px 16px;margin-top:12px}
.pipe-legend button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px 0;text-align:left;color:var(--text)}
.pipe-legend b{color:var(--ink);min-width:28px;text-align:right}
.sw{width:10px;height:10px;border-radius:2px;flex:none}
.alerts{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:6px 10px;font-weight:600;font-size:14px;color:var(--ink)}
.chip b{font-size:16px}
.chip.crit b{color:var(--crit)}.chip.warn b{color:var(--warn)}.chip.info b{color:var(--accent)}
.chip.zero{opacity:.55}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;color:var(--text)}
.row:first-child{border-top:0}
.row:hover .r-soc{color:var(--accent)}
.r-date{font-weight:700;color:var(--ink)}
.r-date small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.r-soc{display:block;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-sub{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:700px){nav.tabs{order:3;width:100%;margin-left:0;flex-wrap:nowrap;overflow-x:auto}nav.tabs button{white-space:nowrap}.who{margin-left:auto}}
.empty{color:var(--muted);font-size:14px;padding:12px 0}

/* Pastilles */
.pill{display:inline-block;font-family:var(--f-cond);font-weight:600;font-size:13px;letter-spacing:.02em;padding:2px 8px;border-radius:2px;white-space:nowrap;border-left:3px solid transparent;background:var(--surface-2);color:var(--text)}
.pill.e1{border-left-color:var(--label)}
.pill.e2{border-left-color:var(--accent);color:var(--accent)}
.pill.e3{border-left-color:var(--warn);color:var(--warn)}
.pill.e4{background:var(--accent);color:var(--accent-ink)}
.pill.e5{border-left-color:var(--ok);color:var(--ok)}
.pill.e6{border-left-color:var(--muted)}
.pill.e7{border-left-color:var(--crit);color:var(--crit)}
.al{font-weight:600;font-size:13px;white-space:nowrap}
.al.crit{color:var(--crit)}.al.warn{color:var(--warn)}.al.info{color:var(--accent)}
.prio{font-weight:700}.prio.p1{color:var(--crit)}.prio.p2{color:var(--warn)}.prio.p3{color:var(--muted)}

/* Liste des fiches */
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.split.open{grid-template-columns:minmax(0,1fr) minmax(360px,440px)}
@media (max-width:1050px){.split.open{grid-template-columns:minmax(0,1fr)}}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters input[type=search]{flex:1 1 220px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:3px;background:var(--surface)}
.filters select{padding:7px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);max-width:100%}
.count{font-size:13px;color:var(--muted);margin-left:auto}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{position:sticky;top:0;background:var(--accent);color:var(--accent-ink);text-align:left;font-weight:600;padding:8px 10px;white-space:nowrap;font-size:13px}
th button{background:none;border:0;color:inherit;font-weight:inherit;padding:0}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr.sel{background:var(--accent-soft)}
tbody tr.closed td{color:var(--label)}
td.soc{font-weight:600;color:var(--ink);max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.soc small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.cards{display:none}
@media (max-width:700px){.tablewrap{display:none}.cards{display:flex;flex-direction:column;gap:8px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px;text-align:left;width:100%;display:grid;gap:6px;color:var(--text)}
.card .top-l{display:flex;justify-content:space-between;gap:8px;align-items:start}
.card .soc{font-weight:700;color:var(--ink)}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted)}

/* Panneau fiche */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:1050px){.sheet{position:fixed;inset:0;max-height:none;border-radius:0;z-index:40;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}}
.sheet-h{display:flex;gap:8px;align-items:start;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.sheet-h h3{margin:0;font-size:18px;color:var(--ink);line-height:1.2}
.sheet-h small{color:var(--muted);font-size:12px}
.sheet-b{padding:14px 16px;display:grid;gap:16px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
fieldset{border:0;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
fieldset legend{padding:0;margin-bottom:8px}
.f{display:grid;gap:3px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12px;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface-2);min-width:0}
.f textarea{resize:vertical;min-height:64px}
.f input[readonly]{background:transparent;border-style:dashed;color:var(--muted)}
.hist{white-space:pre-wrap;font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:8px;max-height:180px;overflow:auto}
.note-row{display:flex;gap:6px}
.note-row input{flex:1;min-width:0;padding:7px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface-2)}
.sheet-f{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.stamp{font-size:12px;color:var(--muted)}

/* Tournées, mise en service */
.form-inline{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.spec td,.spec th{font-size:13px}
.spec code{font-size:12px;background:var(--surface-2);padding:1px 4px;border-radius:2px}
.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--night);color:#fff;padding:10px 16px;border-radius:3px;font-weight:600;z-index:60;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}
</style>

</head>

      const f = fiches.find(x => x.soc === soc);
      if (f) Object.assign(f, {etape: ETAPES[3], dateRDV: addDays(t, d), heure: h, duree: du, lieu: l, agenda: ag, demo: true,
        consigne: "Exemple : prévoir 1/2 journée, visite atelier + revue du parc réducteurs."});
    }
    return { fiches, tournees: [
      {id:"T1", du:addDays(t,2), au:addDays(t,4), zone:"Nord (59/62)", dispo:"Journée", consigne:"Exemple : grouper Dunkerque et Calais."},
      {id:"T2", du:addDays(t,8), au:addDays(t,9), zone:"Liège / Namur", dispo:"Matin", consigne:"Exemple : après-midi réservé atelier."}] };
  },
  persist(state) { try { localStorage.setItem(this.key, JSON.stringify({fiches: state.fiches, tournees: state.tournees})); } catch (e) {} },
  async saveFiche(f, state) {
    if (!f.id) { const n = Math.max(0, ...state.fiches.map(x => +String(x.id).replace(/\D/g,"") || 0)) + 1; f.id = "RDV-" + String(n).padStart(4,"0"); }
    const i = state.fiches.findIndex(x => x.id === f.id);
    if (i >= 0) state.fiches[i] = f; else state.fiches.unshift(f);
    this.persist(state); return f;
  },
  async saveTournee(t, state) {
    if (!t.id) t.id = "T" + Date.now();
    const i = state.tournees.findIndex(x => x.id === t.id);
    if (i >= 0) state.tournees[i] = t; else state.tournees.push(t);
    this.persist(state); return t;
  },
  reset() { try { localStorage.removeItem(this.key); } catch (e) {} }
};

/* ===================== Stockage : Supabase ===================== */
// ===== Stockage Supabase =====
const COLS = { soc:"soc", ref:"ref", contact:"contact", tel:"tel", mail:"mail", adr:"adr", pays:"pays", zone:"zone", statut:"statut",
  prio:"prio", objet:"objet", consigne:"consigne", resp:"resp", etape:"etape", nb:"nb", last:"last", relance:"relance",
  dateRDV:"date_rdv", heure:"heure", duree:"duree", lieu:"lieu", agenda:"agenda", hist:"hist", entree:"entree" };
const TCOLS = { du:"du", au:"au", zone:"zone", dispo:"dispo", consigne:"consigne" };
const NUMS = ["prio","nb","duree"], DATES = ["last","relance","dateRDV","entree","du","au"];
let sb = null;
const SupaStore = {
  user: "",
  client() { if (!sb) sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey, { auth: { persistSession: true, detectSessionInUrl: true } }); return sb; },
  async session() { const { data } = await this.client().auth.getSession(); return data.session; },
  fromDb(r, map) {
    const o = { id: r.id, modif: r.updated_at ? fr(r.updated_at.slice(0,10)) + " " + r.updated_at.slice(11,16) + " par " + (r.updated_by || "?") : "" };
    for (const [k, c] of Object.entries(map)) o[k] = r[c] === null || r[c] === undefined ? "" : r[c];
    return o;
  },
  toDb(o, map) {
    const r = {};
    for (const [k, c] of Object.entries(map)) {
      if (k === "agenda" || !(k in o)) continue;
      let v = o[k];
      if (NUMS.includes(k)) v = v === "" || v === null || isNaN(+v) ? null : +v;
      else if (DATES.includes(k)) v = v ? String(v).slice(0,10) : null;
      else v = v === "" || v === null ? null : String(v);
      r[c] = v;
    }
    return r;
  },
  async all(table) {
    let out = [], from = 0;
    for (;;) { const { data, error } = await this.client().from(table).select("*").order("id").range(from, from + 999);
      if (error) throw new Error(error.message); out = out.concat(data); if (data.length < 1000) break; from += 1000; }
    return out;
  },
  async load() {
    const s = await this.session();
    if (!s) return { needsLogin: true, fiches: [], tournees: [] };
    this.user = s.user.email;
    const { data: ok, error } = await this.client().rpc("is_member");
    if (error) throw new Error(error.message);
    if (!ok) return { notMember: true, fiches: [], tournees: [] };
    const [a, b] = await Promise.all([this.all("fiches"), this.all("tournees")]);
    return { fiches: a.map(r => this.fromDb(r, COLS)), tournees: b.map(r => this.fromDb(r, TCOLS)), needsLogin: false, notMember: false };
  },
  async upsert(table, map, o) {
    const row = this.toDb(o, map);
    const q = o.id ? this.client().from(table).update(row).eq("id", o.id) : this.client().from(table).insert(row);
    const { data, error } = await q.select().single();
    if (error) throw new Error(error.message);
    return this.fromDb(data, map);
  },
  async saveFiche(f, state) {
    const isNew = !f.id; if (isNew) delete f.entree;   // date d'entrée posée par la base
    const saved = await this.upsert("fiches", COLS, f);
    const i = state.fiches.findIndex(x => x.id === saved.id);
    if (i >= 0) state.fiches[i] = saved; else state.fiches.unshift(saved);
    return saved;
  },
  async saveTournee(t, state) {
    const saved = await this.upsert("tournees", TCOLS, t);
    const i = state.tournees.findIndex(x => x.id === saved.id);
    if (i >= 0) state.tournees[i] = saved; else state.tournees.push(saved);
    return saved;
  },
  async login(email, password) {
    const { error } = await this.client().auth.signInWithPassword({ email, password });
    if (error) throw new Error(error.message === "Invalid login credentials" ? "adresse ou mot de passe incorrect" : error.message);
  },
  async setPassword(password) {
    const { error } = await this.client().auth.updateUser({ password });
    if (error) throw new Error(error.message);
  },
  async logout() { await this.client().auth.signOut(); location.reload(); },
  async importFiches(rows, log) {
    let ok = 0;
    for (let i = 0; i < rows.length; i += 100) {
      const chunk = rows.slice(i, i + 100).map(r => ({ ...this.toDb({ ...r, entree: "" }, COLS) }));
      const { error } = await this.client().from("fiches").insert(chunk);
      if (error) { log("Erreur à partir de la fiche " + (i + 1) + " : " + error.message); break; }
      ok += chunk.length; log("Import : " + ok + " / " + rows.length);
    }
    return ok;
  },
  live(onChange) {
    this.client().channel("suivi").on("postgres_changes", { event: "*", schema: "public", table: "fiches" }, p => onChange("fiches", p))
      .on("postgres_changes", { event: "*", schema: "public", table: "tournees" }, p => onChange("tournees", p)).subscribe();
  }
};

function filtered() {
  const q = S.flt.q.trim().toLowerCase();
  let L = S.fiches.filter(f =>
    (!q || [f.soc, f.contact, f.objet, f.zone, f.hist, f.adr, f.id].join(" ").toLowerCase().includes(q)) &&
    (!S.flt.etape || f.etape === S.flt.etape) && (!S.flt.pays || f.pays === S.flt.pays) &&
    (!S.flt.prio || String(f.prio) === S.flt.prio) && (!S.flt.resp || f.resp === S.flt.resp) &&
    (!S.flt.alerte || (S.flt.alerte === "*" ? alerte(f) : alerte(f) === S.flt.alerte)) &&
    (S.flt.open !== "1" || S.flt.etape || !closed(f)));
  const [k, dir] = S.sort;
  const val = f => k === "alerte" ? (alerte(f) ? ALERTS.findIndex(a => a[0] === alerte(f)) : 99)
    : k === "etape" ? etIdx(f.etape) : k === "prio" ? (+f.prio || 9)
    : k === "rdv" ? (f.dateRDV || "9999") : k === "relance" ? (f.relance || "9999") : String(f[k] || "").toLowerCase();
  return L.sort((a,b) => { const x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : 0) * dir || (+a.prio||9) - (+b.prio||9); });
}

      <form id="tform" class="form-inline">
        <div class="f"><label for="t-du">Du</label><input id="t-du" type="date" required></div>
        <div class="f"><label for="t-au">Au</label><input id="t-au" type="date"></div>
        <div class="f"><label for="t-zone">Zone / départements</label><input id="t-zone" required placeholder="Nord (59/62)"></div>
        <div class="f"><label for="t-dispo">Disponibilité</label><select id="t-dispo">${opts(DISPO, "Journée", "…")}</select></div>
        <div class="f" style="grid-column:span 2"><label for="t-cons">Consigne Damien</label><input id="t-cons" placeholder="Grouper les visites…"></div>
        <button class="btn primary" type="submit">Ajouter</button>
      </form></section>
    <section class="panel span-12"><h2><span class="lbl">Tournées planifiées</span></h2>
      <div class="tablewrap" style="border:0"><table><thead><tr><th>Semaine</th><th>Du</th><th>Au</th><th>Zone</th><th>Disponibilité</th><th>Consigne</th><th>RDV fixés</th></tr></thead>
      <tbody>${L.map(x => `<tr class="${(x.au || x.du) < t ? "closed" : ""}" style="cursor:default"><td class="num">S${isoWeek(x.du)}</td><td class="num">${fr(x.du)}</td><td class="num">${fr(x.au)}</td>
        <td class="soc">${esc(x.zone)}</td><td>${x.dispo === "Indisponible" ? `<span class="al crit">Indisponible</span>` : esc(x.dispo)}</td><td>${esc(x.consigne)}</td><td class="num"><b>${rdvIn(x)}</b></td></tr>`).join("") || `<tr><td colspan="7" class="empty">Aucune tournée.</td></tr>`}</tbody></table></div></section>
  </div>`;
}
function isoWeek(iso) { const [y,m,d] = iso.split("-").map(Number); const x = new Date(Date.UTC(y,m-1,d)); const n = x.getUTCDay() || 7; x.setUTCDate(x.getUTCDate() + 4 - n); const y0 = new Date(Date.UTC(x.getUTCFullYear(),0,1)); return Math.ceil(((x - y0) / 86400000 + 1) / 7); }

function viewSetup() {
  return `<div class="dash">
    <section class="panel span-6"><h2><span class="lbl">Compte</span></h2>
      <div class="rows">
        <div class="row" style="grid-template-columns:140px minmax(0,1fr);cursor:default"><span class="lbl">Connecté</span><span style="overflow-wrap:anywhere">${esc(SupaStore.user)}</span></div>
        <div class="row" style="grid-template-columns:140px minmax(0,1fr);cursor:default"><span class="lbl">Fiches</span><span class="num">${S.fiches.length}</span></div>
        <div class="row" style="grid-template-columns:140px minmax(0,1fr);cursor:default"><span class="lbl">Tournées</span><span class="num">${S.tournees.length}</span></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
        <button class="btn" id="export">Exporter vers Excel (CSV)</button>
        <button class="btn" id="logout">Se déconnecter</button>
      </div>
      <form id="pwform" style="display:grid;gap:8px;margin-top:16px;max-width:360px">
        <span class="lbl">Changer mon mot de passe</span>
        <input type="text" autocomplete="username" value="${esc(SupaStore.user)}" hidden>
        <div class="f"><label for="pw1">Nouveau mot de passe (8 caractères minimum)</label><input id="pw1" type="password" autocomplete="new-password" required></div>
        <div class="f"><label for="pw2">Confirmer</label><input id="pw2" type="password" autocomplete="new-password" required></div>
        <button class="btn small" type="submit">Enregistrer le mot de passe</button>
      </form>
    </section>
    <section class="panel span-6"><h2><span class="lbl">Import initial (une seule fois)</span></h2>
      <p class="demo-note" style="margin:0 0 8px">Sélectionnez <code>import_fiches_SuiviRDV.json</code>. ${S.fiches.length ? "<b>La base contient déjà " + S.fiches.length + " fiches : un nouvel import créerait des doublons.</b>" : ""}</p>
      <input type="file" id="inst-file" accept=".json,application/json" style="max-width:100%" ${S.fiches.length ? "disabled" : ""}>
      <div id="inst-log" class="hist" style="margin-top:12px;min-height:60px">${esc(S.instLog || "Journal d'import.")}</div>
    </section></div>`;
}
function viewLogin(msg) {
  return `<div style="max-width:440px;margin:40px auto" class="panel">
    <h2 style="margin:0 0 6px;font-size:20px;color:var(--ink)">Connexion</h2>
    <p class="demo-note" style="margin:0 0 14px">Adresse professionnelle et mot de passe. La session reste ouverte sur cet appareil.</p>
    <form id="login" style="display:grid;gap:10px">
      <div class="f"><label for="l-email">Adresse e-mail</label><input id="l-email" type="email" required autocomplete="username" placeholder="prenom@mgh.be" value="${esc(S.lastEmail || "")}"></div>
      <div class="f"><label for="l-pass">Mot de passe</label><input id="l-pass" type="password" required autocomplete="current-password"></div>
      <button class="btn primary" type="submit">Se connecter</button>
    </form>
    <p class="demo-note" style="margin:12px 0 0">Mot de passe oublié : demandez à Damien de le réinitialiser.</p>
    ${msg ? `<p style="margin:12px 0 0;font-weight:600;color:var(--ink)">${esc(msg)}</p>` : ""}
  </div>`;
}
function csvExport() {
  const keys = ["ref","soc","contact","tel","mail","adr","pays","zone","statut","prio","objet","consigne","resp","etape","nb","last","relance","dateRDV","heure","duree","lieu","hist","entree"];
  const head = ["Réf.","Société","Contact","Téléphone","Mail","Adresse","Pays","Dpt / zone","Statut compte","Priorité","Objet du RDV","Consigne Damien","Responsable","Étape","Nb tentatives","Dernier contact","Prochaine relance","Date RDV","Heure","Durée (h)","Lieu / format","Historique","Date d'entrée"];
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const lines = [head.map(q).join(";")].concat(S.fiches.map(f => keys.map(k => q(f[k])).join(";")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" }));
  a.download = "Suivi_RDV_" + isoToday() + ".csv"; document.body.appendChild(a); a.click(); a.remove();
}
function icsFor(f) {
  const d = f.dateRDV.replace(/-/g, ""), h = (f.heure || "08:00").replace(":", "");
  const [hh, mm] = (f.heure || "08:00").split(":").map(Number); const end = hh * 60 + mm + Math.round((+f.duree || 2) * 60);
  const e = String(Math.floor(end / 60) % 24).padStart(2,"0") + String(end % 60).padStart(2,"0");
  const t = s => String(s || "").replace(/\\/g,"\\\\").replace(/[,;]/g, m => "\\" + m).replace(/\r?\n/g, "\\n");
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//MGH//Suivi RDV//FR","BEGIN:VEVENT",
    "UID:rdv-" + f.id + "-" + d + "@suivi-rdv", "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g,"").slice(0,15) + "Z",
    "DTSTART:" + d + "T" + h + "00", "DTEND:" + d + "T" + e + "00",
    "SUMMARY:" + t("RDV " + f.soc + (f.contact ? " · " + f.contact : "")),
    "LOCATION:" + t(f.lieu === "Sur site client" || !f.lieu ? (f.adr || f.soc) : f.lieu),
    "DESCRIPTION:" + t(["Objet : " + (f.objet || ""), "Consigne : " + (f.consigne || ""), "Tél. : " + (f.tel || ""), "Mail : " + (f.mail || "")].join("\n")),
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar;charset=utf-8" }));
  a.download = "RDV_" + (f.soc || "client").replace(/[^\w-]+/g, "_") + "_" + f.dateRDV + ".ics"; document.body.appendChild(a); a.click(); a.remove();
}

/* ===================== Rendu et événements ===================== */
function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === S.view)));
  document.querySelectorAll("#role button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.role === S.role)));

  const sc = window.scrollY;
  if (S.needsLogin || S.notMember) { $app.innerHTML = viewLogin(S.notMember ? "L'adresse " + SupaStore.user + " n'est pas autorisée. Demandez à Damien de l'ajouter." : S.loginMsg); return; }
  $app.innerHTML = S.view === "dash" ? viewDash() : S.view === "fiches" ? viewFiches() : S.view === "tournees" ? viewTournees() : viewSetup();
  window.scrollTo(0, sc);
}
function go(view) { S.view = view; if (view !== "fiches") { S.sel = null; S.draft = null; } render(); window.scrollTo(0,0); }
function openFiche(id) { const f = S.fiches.find(x => String(x.id) === String(id)); if (!f) return; S.sel = id; S.draft = {...f}; S.view = "fiches"; render(); }
function newFiche() { S.sel = "__new"; S.draft = { id:"", soc:"", contact:"", tel:"", mail:"", adr:"", pays:"", zone:"", statut:"Prospect", prio:2, objet:"", consigne:"",
  resp:"Vit'Admin", etape:ETAPES[0], nb:0, last:"", relance:"", dateRDV:"", heure:"", duree:"", lieu:"", agenda:"", hist:"", entree:"", modif:"" }; render(); setTimeout(() => document.getElementById("d-soc")?.focus(), 0); }
function note(txt) { const d = S.draft; d.hist = frShort(isoToday()) + " " + S.role + " : " + txt + (d.hist ? "\n" + d.hist : ""); }
function readDraft() { document.querySelectorAll("[data-k]").forEach(el => { S.draft[el.dataset.k] = el.type === "number" ? (el.value === "" ? "" : +el.value) : el.value; }); }

document.querySelector("nav.tabs").addEventListener("click", e => { const b = e.target.closest("[data-view]"); if (b) go(b.dataset.view); });
document.getElementById("role").addEventListener("click", e => { const b = e.target.closest("[data-role]"); if (!b) return; S.role = b.dataset.role;
  saveUi(); render(); });

$app.addEventListener("click", async e => {
  const t = e.target;
  const o = t.closest("[data-open]"); if (o && !t.closest(".sheet")) { openFiche(o.dataset.open); return; }
  const ge = t.closest("[data-goto-etape]"); if (ge) { Object.assign(S.flt, { etape: ge.dataset.gotoEtape, alerte: "", q: "" }); saveUi(); go("fiches"); return; }
  const ga = t.closest("[data-goto-alerte]"); if (ga) { Object.assign(S.flt, { alerte: ga.dataset.gotoAlerte, etape: "", q: "" }); saveUi(); go("fiches"); return; }
  const gv = t.closest("[data-view-go]"); if (gv) { go(gv.dataset.viewGo); return; }
  const so = t.closest("[data-sort]"); if (so) { const k = so.dataset.sort; S.sort = [k, S.sort[0] === k ? -S.sort[1] : 1]; render(); return; }
  if (t.id === "f-reset") { S.flt = { q: "", etape: "", pays: "", prio: "", resp: "", alerte: "", open: "1" }; saveUi(); render(); return; }
  if (t.id === "new") { newFiche(); return; }
  if (t.id === "close" || t.id === "cancel") { S.sel = null; S.draft = null; S.pending = false; render(); return; }
  if (t.id === "export") { csvExport(); toast("Export CSV téléchargé"); return; }
  if (t.id === "logout") { await SupaStore.logout(); return; }
  if (t.id === "ics") { readDraft(); icsFor(S.draft); toast("Fichier .ics téléchargé : ouvrez-le pour l'ajouter à Outlook"); return; }
  if (t.id === "reset-demo") { DemoStore.reset(); Object.assign(S, await DemoStore.load()); toast("Données de démonstration réinitialisées"); render(); return; }
  const q = t.closest("[data-q]");
  if (q) { readDraft(); const d = S.draft, today = isoToday();
    if (q.dataset.q === "noanswer") { d.nb = (+d.nb || 0) + 1; d.last = today; if (d.etape === ETAPES[0]) d.etape = ETAPES[1]; if (!d.relance || d.relance <= today) d.relance = addDays(today, 3); note("appel sans réponse"); }
    if (q.dataset.q === "r2") d.relance = addDays(today, 2);
    if (q.dataset.q === "r7") d.relance = addDays(today, 7);
    if (q.dataset.q === "r30") d.relance = addDays(today, 30);
    if (q.dataset.q === "propose") { d.etape = ETAPES[2]; d.last = today; if (!d.relance) d.relance = addDays(today, 3); note("créneau proposé"); }
    if (q.dataset.q === "fixed") { d.etape = ETAPES[3]; d.last = today; d.relance = ""; note("RDV fixé"); }
    if (q.dataset.q === "done") { d.etape = ETAPES[4]; note("RDV réalisé"); }
    render(); if (q.dataset.q === "fixed") setTimeout(() => document.getElementById("d-dateRDV")?.focus(), 0); return; }
  if (t.id === "addnote") { readDraft(); const v = document.getElementById("note").value.trim(); if (v) { note(v); render(); } return; }
  if (t.id === "save") { readDraft(); const d = S.draft;
    if (!d.soc.trim()) { toast("Indiquez le nom de la société"); document.getElementById("d-soc").focus(); return; }
    if (d.etape === ETAPES[3] && !d.dateRDV) { toast("RDV fixé : indiquez la date"); document.getElementById("d-dateRDV").focus(); return; }
    const isNew = !d.id;
    const prev = S.fiches.find(x => String(x.id) === String(d.id));
    if (prev && prev.etape === ETAPES[3] && (prev.dateRDV !== d.dateRDV || prev.heure !== d.heure)) d.agenda = "";
    if (CONFIG.mode === "demo") { if (isNew) d.entree = isoToday(); d.modif = fr(isoToday()) + " par " + (S.role === "DM" ? "Damien" : "Assistante"); }
    try { const saved = await Store.saveFiche({...d}, S); S.sel = saved.id; S.draft = {...saved}; toast(isNew ? "Fiche créée : " + saved.id : "Fiche enregistrée"); render(); }
    catch (err) { toast("Enregistrement impossible : " + err.message); }
    return; }
});
$app.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q") { S.flt.q = t.value; clearTimeout(render.h); render.h = setTimeout(() => { saveUi(); render(); const q = document.getElementById("q"); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 180); }
});
$app.addEventListener("change", async e => {
  if (e.target.id === "inst-file" && e.target.files[0]) { const inp = e.target; inp.disabled = true;
    const log = m => { S.instLog = (S.instLog ? S.instLog + "\n" : "") + m; const el = document.getElementById("inst-log"); if (el) el.textContent = S.instLog; };
    try { const rows = JSON.parse(await inp.files[0].text()); if (!Array.isArray(rows)) throw new Error("fichier non conforme");
      log("Import de " + rows.length + " fiches…"); const n = await SupaStore.importFiches(rows, log);
      Object.assign(S, await Store.load()); log("Terminé : " + n + " fiches importées."); render(); }
    catch (err) { log("Erreur : " + err.message); inp.disabled = false; }
    return; }
  const t = e.target, map = { "f-etape":"etape", "f-pays":"pays", "f-prio":"prio", "f-resp":"resp", "f-alerte":"alerte" };
  if (map[t.id]) { S.flt[map[t.id]] = t.value; saveUi(); render(); }
  if (t.id === "f-open") { S.flt.open = t.checked ? "1" : ""; saveUi(); render(); }
  if (t.dataset && t.dataset.k) { readDraft(); }
});
$app.addEventListener("keydown", e => { if (e.target.id === "note" && e.key === "Enter") { e.preventDefault(); document.getElementById("addnote").click(); } });
$app.addEventListener("submit", async e => {
  if (e.target.id === "login") { e.preventDefault(); const em = document.getElementById("l-email").value.trim(); S.lastEmail = em;
    try { await SupaStore.login(em, document.getElementById("l-pass").value); S.loginMsg = ""; Object.assign(S, await Store.load()); boot2(); }
    catch (err) { S.loginMsg = "Connexion impossible : " + err.message; } render(); return; }
  if (e.target.id === "pwform") { e.preventDefault(); const a = document.getElementById("pw1").value, b = document.getElementById("pw2").value;
    if (a.length < 8) { toast("8 caractères minimum"); return; } if (a !== b) { toast("Les deux saisies diffèrent"); return; }
    try { await SupaStore.setPassword(a); toast("Mot de passe modifié"); e.target.reset(); } catch (err) { toast("Modification impossible : " + err.message); } return; }
  if (e.target.id !== "tform") return; e.preventDefault();
  const v = id => document.getElementById(id).value;
  try { await Store.saveTournee({ id: "", du: v("t-du"), au: v("t-au"), zone: v("t-zone"), dispo: v("t-dispo"), consigne: v("t-cons") }, S); toast("Tournée ajoutée"); render(); }
  catch (err) { toast("Enregistrement impossible : " + err.message); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.sel) { S.sel = null; S.draft = null; render(); } });

(async () => {
  try { Object.assign(S, await Store.load()); }
  catch (err) { $app.innerHTML = `<div class="panel"><b>Connexion à la base impossible.</b><p>${esc(err.message)}</p><p>Vérifiez votre connexion internet puis rechargez la page.</p></div>`; return; }
  if (location.hash === "#fiches" || location.hash === "#tournees") S.view = location.hash.slice(1);
  boot2();
  render();
})();
function boot2() {
  if (S.needsLogin || S.notMember || boot2.done) return; boot2.done = true;
  if (!S.fiches.length) S.view = "setup";
  SupaStore.live((table, p) => {
    const map = table === "fiches" ? COLS : TCOLS, list = table === "fiches" ? S.fiches : S.tournees;
    if (p.eventType === "DELETE") { const i = list.findIndex(x => x.id === p.old.id); if (i >= 0) list.splice(i, 1); }
    else { const o = SupaStore.fromDb(p.new, map); const i = list.findIndex(x => x.id === o.id); if (i >= 0) list[i] = o; else list.unshift(o); }
    if (S.sel) { S.pending = true; } else render();
  });
}
</script>

</body>
</html>
